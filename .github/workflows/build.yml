# NiAvERP CI — build + Android 8 emulator proof (template; E3)
# Not executed from this session (session has no GitHub Actions runner / emulator).
# Evidence: PENDING-INPUT until real CI run records APK hash, emulator fingerprint, logcat.
name: NiAvERP Build and Android 8 Proof

on:
  push:
    branches: [main, baseline-triage-20261006-d0r2, e3-20261006]
  pull_request:
    branches: [main, baseline-triage-20261006-d0r2]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # pin to version used by environment; verify from pubspec.yaml / SDK notes
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true
      - name: Local properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Pub get
        working-directory: niaverp
        run: flutter pub get
      - name: Analyze
        working-directory: niaverp
        run: flutter analyze
      - name: Test
        working-directory: niaverp
        run: flutter test
      - name: Build APK release
        working-directory: niaverp
        env:
          NIAV_RELEASE_STORE_FILE: ${{ secrets.NIAV_RELEASE_STORE_FILE }}
          NIAV_RELEASE_STORE_PASSWORD: ${{ secrets.NIAV_RELEASE_STORE_PASSWORD }}
          NIAV_RELEASE_KEY_ALIAS: ${{ secrets.NIAV_RELEASE_KEY_ALIAS }}
          NIAV_RELEASE_KEY_PASSWORD: ${{ secrets.NIAV_RELEASE_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name=${{ github.event.inputs.build_name || '1.0.0' }} \
            --build-number=${{ github.event.inputs.build_number || '1' }}
        # Note: build-name / build-number from CI inputs documented in result file (A3).
      - name: Compute APK SHA-256
        run: sha256sum niaverp/build/app/outputs/flutter-apk/app-release.apk | tee apk-sha256.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: niaverp-apk-sha-log
          path: |
            niaverp/build/app/outputs/flutter-apk/app-release.apk
            apk-sha256.txt
            niaverp/test/*.log
  emulator-api26:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Launch emulator API 26 (AVD evidence — not physical device)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
      - name: Install APK
        run: adb install niaverp/build/app/outputs/flutter-apk/app-release.apk || adb install niaverp/build/app/outputs/flutter-apk/app-debug.apk
      - name: Smoke test (home screen opens; relaunch same DB)
        run: |
          adb shell am start -n com.niaverp.niaverp/com.niaverp.niaverp.MainActivity
          sleep 5
          adb logcat -d > emulator-api26-logcat.txt
          # Instrumented assertion (host-only evidence placeholder): app opens to home.
          echo "AVD evidence — not physical device (G0-VER-005/008 pending)" >> emulator-api26-logcat.txt
      - name: Upload AVD evidence
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api26-evidence
          path: emulator-api26-logcat.txt
